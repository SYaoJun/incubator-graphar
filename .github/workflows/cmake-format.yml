name: CMake Format Check

on:
  push:
    branches:
      - main
    paths:
      - '**CMakeLists.txt'
      - '**/*.cmake'
      - 'cmake_format.py'
      - '.github/workflows/cmake-format.yml'
  pull_request:
    branches:
      - main
    paths:
      - '**CMakeLists.txt'
      - '**/*.cmake'
      - 'cmake_format.py'
      - '.github/workflows/cmake-format.yml'

concurrency:
  group: ${{ github.repository }}-${{ github.event.number || github.head_ref || github.sha }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  cmake-format:
    name: Check CMake Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install cmake-format
        run: pip install cmake-format

      - name: Run cmake-format check
        run: |
          find . \( -name "CMakeLists.txt" -o -name "*.cmake" \) \
            -not -path "./build/*" \
            -not -path "./build_*/*" \
            -not -path "./.git/*" \
            -not -path "./rust/target/*" \
            -not -path "./cpp/build/*" \
            -not -path "./cpp/build_*/*" \
            | xargs cmake-format --config-files cmake_format.py --check
